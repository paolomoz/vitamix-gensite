<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketer Dashboard v2 — Content Performance Matrix</title>
  <style>body { margin: 0; padding: 0; }</style>
  <style>
/**
 * Demo Dashboard v2 — Content Performance Matrix
 * AEM Experience Manager shell + Spectrum 2 light, stage-optimized.
 */

@font-face {
  font-family: "Adobe Clean";
  font-weight: 400;
  font-style: normal;
  font-display: swap;
  src: url("/fonts/AdobeClean-Regular.otf") format("opentype");
}

@font-face {
  font-family: "Adobe Clean";
  font-weight: 500;
  font-style: normal;
  font-display: swap;
  src: url("/fonts/AdobeClean-Medium.otf") format("opentype");
}

@font-face {
  font-family: "Adobe Clean";
  font-weight: 700;
  font-style: normal;
  font-display: swap;
  src: url("/fonts/AdobeClean-Bold.otf") format("opentype");
}

/* ── Tokens ── */
.demo-dashboard2 {
  --dd2-font: "Adobe Clean", "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --dd2-mono: "Source Code Pro", "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --dd2-gray-25: #fff;
  --dd2-gray-50: #fafafa;
  --dd2-gray-75: #f5f5f5;
  --dd2-gray-100: #ededed;
  --dd2-gray-200: #e1e1e1;
  --dd2-gray-300: #d3d3d3;
  --dd2-gray-400: #b3b3b3;
  --dd2-gray-500: #8a8a8a;
  --dd2-gray-600: #6c6c6c;
  --dd2-gray-700: #4a4a4a;
  --dd2-gray-800: #2a2a2a;
  --dd2-gray-900: #111;
  --dd2-accent: #3b63fb;
  --dd2-accent-soft: rgb(59 99 251 / 0.12);
  --dd2-good: #079355;
  --dd2-mid: #e68619;
  --dd2-low: #d73220;
  --dd2-shadow-sm: 0 1px 2px rgb(0 0 0 / 0.04), 0 1px 1px rgb(0 0 0 / 0.02);
  --dd2-shadow-md: 0 2px 4px rgb(0 0 0 / 0.04), 0 1px 2px rgb(0 0 0 / 0.03);
  --dd2-radius-sm: 6px;
  --dd2-radius-md: 10px;
  --dd2-radius-lg: 14px;
  --dd2-sp-100: 8px;
  --dd2-sp-150: 10px;
  --dd2-sp-200: 12px;
  --dd2-sp-300: 16px;
  --dd2-sp-400: 20px;
  --dd2-sp-500: 28px;
  --dd2-sp-600: 40px;
}

.demo-dashboard2,
.demo-dashboard2 *,
.demo-dashboard2 h1,
.demo-dashboard2 h2,
.demo-dashboard2 p,
.demo-dashboard2 span,
.demo-dashboard2 th,
.demo-dashboard2 td,
.demo-dashboard2 button,
.demo-dashboard2 strong {
  font-family: var(--dd2-font);
  letter-spacing: 0;
  box-sizing: border-box;
}

/* ── Shell ── */
.dd2-shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
  position: fixed;
  top: 0;
  left: 0;
  background: var(--dd2-gray-50);
  z-index: 9999;
  color: var(--dd2-gray-800);
}

/* ── Top header ── */
header.dd2-header {
  position: static;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 48px;
  padding: 0 var(--dd2-sp-300);
  background: var(--dd2-gray-25);
  border: 0;
  border-bottom: 1px solid var(--dd2-gray-200);
  flex-shrink: 0;
  z-index: auto;
}

.dd2-header-left,
.dd2-header-right {
  display: flex;
  align-items: center;
  gap: var(--dd2-sp-200);
}

.dd2-header-menu,
.dd2-header-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border: none;
  background: none;
  color: var(--dd2-gray-600);
  cursor: default;
  border-radius: 8px;
  position: relative;
  transition: background-color 130ms ease, color 130ms ease;
}

.dd2-header-menu { color: var(--dd2-gray-800); }
.dd2-header-menu:hover,
.dd2-header-action:hover { background: var(--dd2-gray-75); color: var(--dd2-gray-800); }

.dd2-header-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--dd2-gray-900);
}

.dd2-header-sep {
  color: var(--dd2-gray-300);
  font-size: 14px;
  margin: 0 2px;
}

.dd2-header-project {
  font-size: 13px;
  font-weight: 500;
  color: var(--dd2-gray-700);
}

.dd2-header-section {
  font-size: 13px;
  font-weight: 400;
  color: var(--dd2-gray-600);
}

.dd2-env {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border: 1px solid var(--dd2-gray-200);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  color: var(--dd2-gray-700);
  background: var(--dd2-gray-50);
}

.dd2-env-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--dd2-good);
  box-shadow: 0 0 0 3px rgb(7 147 85 / 0.16);
}

.dd2-bell-dot {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--dd2-low);
  border: 1.5px solid var(--dd2-gray-25);
}

.dd2-avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, #5681ff, #3b63fb);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  margin-left: var(--dd2-sp-100);
}

/* ── Body / sidebar ── */
.dd2-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.dd2-sidebar {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 56px;
  background: var(--dd2-gray-25);
  border-right: 1px solid var(--dd2-gray-200);
  padding: calc(var(--dd2-sp-200) + 30px) 0 var(--dd2-sp-200);
  flex-shrink: 0;
  gap: 4px;
}

.dd2-sidebar-spacer { flex: 1; }

.dd2-nav-item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border: none;
  background: none;
  color: var(--dd2-gray-600);
  cursor: default;
  border-radius: 10px;
  transition: background-color 130ms ease, color 130ms ease;
}

.dd2-nav-item:hover { background: var(--dd2-gray-75); color: var(--dd2-gray-800); }
.dd2-nav-active,
.dd2-nav-active:hover { background: var(--dd2-accent); color: #fff; }

/* ── Main content ── */
.dd2-main {
  flex: 1;
  overflow-y: auto;
  background: var(--dd2-gray-50);
  scrollbar-width: thin;
  scrollbar-color: var(--dd2-gray-300) transparent;
}

.dd2-content {
  padding: var(--dd2-sp-500) var(--dd2-sp-600);
  max-width: 1920px;
  margin: 0 auto;
}

.dd2-view {
  display: flex;
  flex-direction: column;
  gap: var(--dd2-sp-400);
}

/* ── Page header ── */
.dd2-page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--dd2-sp-400);
}

.dd2-page-head-titles { min-width: 0; }

.dd2-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--dd2-gray-600);
  margin-bottom: 8px;
}

.dd2-live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px 3px 8px;
  border-radius: 999px;
  background: rgb(7 147 85 / 0.10);
  color: var(--dd2-good);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.dd2-live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--dd2-good);
  box-shadow: 0 0 0 0 rgb(7 147 85 / 0.6);
  animation: dd2-live-pulse 1600ms ease-out infinite;
}

@keyframes dd2-live-pulse {
  0% { box-shadow: 0 0 0 0 rgb(7 147 85 / 0.5); }
  70% { box-shadow: 0 0 0 6px rgb(7 147 85 / 0); }
  100% { box-shadow: 0 0 0 0 rgb(7 147 85 / 0); }
}

.dd2-sessions {
  font-size: 12px;
  color: var(--dd2-gray-700);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.dd2-sep-dot {
  display: inline-block;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--dd2-gray-400);
  margin: 0 2px;
}

.dd2-updated {
  font-size: 12px;
  color: var(--dd2-gray-500);
  font-variant-numeric: tabular-nums;
}

.dd2-page-title {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.15;
  color: var(--dd2-gray-900);
  margin: 0 0 6px;
  letter-spacing: -0.01em;
}

.dd2-page-sub {
  font-size: 14px;
  color: var(--dd2-gray-600);
  line-height: 1.4;
  max-width: 720px;
}

.dd2-page-head-actions {
  display: flex;
  gap: var(--dd2-sp-150);
  flex-shrink: 0;
}

.dd2-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 14px;
  border: 1px solid var(--dd2-gray-300);
  border-radius: 8px;
  background: var(--dd2-gray-25);
  color: var(--dd2-gray-800);
  font-size: 13px;
  font-weight: 500;
  cursor: default;
  transition: background-color 130ms ease, border-color 130ms ease;
}

.dd2-btn:hover { background: var(--dd2-gray-75); border-color: var(--dd2-gray-400); }
.dd2-btn-ghost { background: transparent; }
.dd2-btn-primary {
  background: var(--dd2-gray-900);
  border-color: var(--dd2-gray-900);
  color: #fff;
}

.dd2-btn-primary:hover { background: #000; border-color: #000; }

/* ── Filter pills ── */
.dd2-filter-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--dd2-gray-200);
}

.dd2-filter-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
}

.dd2-filter-label {
  font-size: 12px;
  color: var(--dd2-gray-500);
  margin-right: 4px;
}

.dd2-pill {
  display: inline-flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--dd2-gray-700);
  font-size: 12px;
  font-weight: 500;
  border-radius: 999px;
  cursor: default;
  transition: background-color 130ms ease, color 130ms ease, border-color 130ms ease;
}

.dd2-pill:hover { background: var(--dd2-gray-75); color: var(--dd2-gray-900); }

.dd2-pill-active,
.dd2-pill-active:hover {
  background: var(--dd2-gray-900);
  color: #fff;
  border-color: var(--dd2-gray-900);
}

/* ── KPI strip ── */
.dd2-kpis {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--dd2-sp-300);
}

.dd2-kpi {
  background: var(--dd2-gray-25);
  border: 1px solid var(--dd2-gray-200);
  border-radius: var(--dd2-radius-md);
  padding: var(--dd2-sp-300) var(--dd2-sp-400);
  box-shadow: var(--dd2-shadow-sm);
}

.dd2-kpi-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--dd2-gray-600);
  margin-bottom: 6px;
}

.dd2-kpi-main {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--dd2-sp-200);
}

.dd2-kpi-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--dd2-gray-900);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.dd2-kpi-trend {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--dd2-good);
  font-weight: 600;
  margin-top: 8px;
  font-variant-numeric: tabular-nums;
}

.dd2-kpi-trend-sub {
  color: var(--dd2-gray-500);
  font-weight: 400;
  margin-left: 2px;
}

.dd2-trend-down { color: var(--dd2-low); }

/* ── Split: matrix + insights ── */
.dd2-split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: var(--dd2-sp-300);
  align-items: stretch;
}

/* ── Card shared ── */
.dd2-matrix-card,
.dd2-insights,
.dd2-ticker-card {
  background: var(--dd2-gray-25);
  border: 1px solid var(--dd2-gray-200);
  border-radius: var(--dd2-radius-lg);
  box-shadow: var(--dd2-shadow-sm);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.dd2-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--dd2-sp-300) var(--dd2-sp-400);
  border-bottom: 1px solid var(--dd2-gray-200);
  gap: var(--dd2-sp-300);
}

.dd2-card-head-left {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.dd2-card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--dd2-gray-900);
  line-height: 1.2;
}

.dd2-card-meta {
  font-size: 12px;
  color: var(--dd2-gray-500);
}

.dd2-card-head-right {
  display: flex;
  align-items: center;
  gap: var(--dd2-sp-200);
}

.dd2-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: none;
  background: none;
  border-radius: 6px;
  color: var(--dd2-gray-500);
  cursor: default;
  transition: background-color 130ms ease, color 130ms ease;
}

.dd2-icon-btn:hover { background: var(--dd2-gray-75); color: var(--dd2-gray-800); }

.dd2-legend {
  display: inline-flex;
  align-items: center;
  gap: var(--dd2-sp-200);
}

.dd2-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--dd2-gray-600);
}

.dd2-legend-swatch {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

.dd2-beta-tag {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 8px;
  border-radius: 4px;
  background: rgb(59 99 251 / 0.12);
  color: var(--dd2-accent);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ── Matrix ── */
.dd2-matrix { padding: var(--dd2-sp-300) var(--dd2-sp-400) var(--dd2-sp-400); }

.dd2-matrix-grid {
  display: grid;
  /* row head + 4 audience cols + avg col */
  grid-template-columns: 240px repeat(4, minmax(0, 1fr)) 72px;
  gap: 6px;
  align-items: stretch;
}

.dd2-mx-corner {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 4px 0 8px;
  font-size: 11px;
  color: var(--dd2-gray-500);
  border-bottom: 1px solid var(--dd2-gray-200);
}

.dd2-mx-corner-row {
  font-weight: 600;
  color: var(--dd2-gray-700);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.dd2-mx-corner-col {
  font-size: 10px;
  color: var(--dd2-gray-500);
  margin-top: 2px;
}

.dd2-mx-col-head {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-end;
  padding: 6px 10px 8px;
  border-bottom: 1px solid var(--dd2-gray-200);
  gap: 2px;
  min-width: 0;
}

.dd2-mx-col-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--dd2-gray-800);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.dd2-mx-col-n {
  font-size: 10px;
  color: var(--dd2-gray-500);
  font-variant-numeric: tabular-nums;
}

.dd2-mx-avg-head .dd2-mx-col-label { color: var(--dd2-gray-500); font-weight: 600; }

.dd2-mx-row-head {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 10px 10px 10px 0;
  gap: 4px;
  border-right: 1px solid var(--dd2-gray-200);
}

.dd2-mx-row-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--dd2-gray-800);
  line-height: 1.2;
}

.dd2-mx-row-trend {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--dd2-good);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.dd2-mx-cell {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 6px;
  height: 60px;
  padding: 10px 12px;
  border-radius: var(--dd2-radius-md);
  background: var(--dd2-gray-75);
  cursor: default;
  transition: transform 130ms ease, box-shadow 130ms ease;
}

.dd2-mx-cell:hover {
  transform: translateY(-1px);
  box-shadow: var(--dd2-shadow-md);
}

.dd2-mx-score {
  font-size: 20px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  letter-spacing: -0.01em;
}

.dd2-mx-bar {
  display: block;
  width: 100%;
  height: 3px;
  background: rgb(0 0 0 / 0.08);
  border-radius: 2px;
  overflow: hidden;
}

.dd2-mx-bar i {
  display: block;
  height: 100%;
  border-radius: 2px;
  opacity: 0.75;
}

.dd2-mx-cell-focus {
  outline: 2px solid rgb(59 99 251 / 0.55);
  outline-offset: -2px;
}

.dd2-mx-cell-pulse {
  animation: dd2-pulse 1800ms ease-out;
}

@keyframes dd2-pulse {
  0% { box-shadow: 0 0 0 0 rgb(59 99 251 / 0.55); transform: scale(1); }
  30% { box-shadow: 0 0 0 10px rgb(59 99 251 / 0); transform: scale(1.03); }
  100% { box-shadow: 0 0 0 0 rgb(59 99 251 / 0); transform: scale(1); }
}

.dd2-mx-avg-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 60px;
  font-size: 14px;
  font-weight: 700;
  color: var(--dd2-gray-600);
  background: var(--dd2-gray-50);
  border-radius: var(--dd2-radius-md);
  font-variant-numeric: tabular-nums;
}

.dd2-matrix-footer {
  display: grid;
  grid-template-columns: 240px repeat(4, minmax(0, 1fr)) 72px;
  gap: 6px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--dd2-gray-200);
}

.dd2-mx-foot-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--dd2-gray-500);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  padding-right: 10px;
}

.dd2-mx-foot-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 28px;
  font-size: 13px;
  font-weight: 700;
  color: var(--dd2-gray-700);
  font-variant-numeric: tabular-nums;
}

.dd2-mx-foot-total {
  color: var(--dd2-gray-900);
  background: var(--dd2-gray-75);
  border-radius: 6px;
}

/* ── Insight rail ── */
.dd2-insight-list {
  list-style: none;
  margin: 0;
  padding: var(--dd2-sp-300) var(--dd2-sp-300) var(--dd2-sp-300);
  display: flex;
  flex-direction: column;
  gap: var(--dd2-sp-150);
  overflow-y: auto;
  flex: 1;
}

.dd2-insight {
  display: flex;
  gap: var(--dd2-sp-200);
  padding: var(--dd2-sp-200) var(--dd2-sp-300);
  border-radius: var(--dd2-radius-md);
  border: 1px solid var(--dd2-gray-200);
  background: var(--dd2-gray-50);
  transition: border-color 130ms ease, background-color 130ms ease;
}

.dd2-insight:hover {
  background: var(--dd2-gray-75);
  border-color: var(--dd2-gray-300);
}

.dd2-insight-signal { border-left: 3px solid var(--dd2-good); }
.dd2-insight-shift  { border-left: 3px solid var(--dd2-accent); }
.dd2-insight-gap    { border-left: 3px solid var(--dd2-low); }

.dd2-insight-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;

/* ── Rendering helpers ── */

function colorForScore(score) {
  // 0-40 red, 40-70 amber, 70-100 green. Return { bg, ink }.
  if (score >= 70) {
    const strength = (score - 70) / 30; // 0..1
    const alpha = 0.12 + strength * 0.55;
    const ink = score >= 85 ? '#0a3b28' : '#0d4f36';
    return { bg: `rgba(7, 147, 85, ${alpha.toFixed(3)})`, ink, tone: 'good' };
  }
  if (score >= 40) {
    const strength = (score - 40) / 30;
    const alpha = 0.10 + strength * 0.35;
    return { bg: `rgba(230, 134, 25, ${alpha.toFixed(3)})`, ink: '#7a4100', tone: 'mid' };
  }
  const strength = 1 - score / 40;
  const alpha = 0.12 + strength * 0.40;
  return { bg: `rgba(215, 50, 32, ${alpha.toFixed(3)})`, ink: '#5a1008', tone: 'low' };
}

function sparkline(data, { w = 68, h = 20, stroke = '#3b63fb' } = {}) {
  const max = Math.max(...data);
  const min = Math.min(...data);
  const range = max - min || 1;
  const step = w / (data.length - 1);
  const pts = data.map((v, i) => `${(i * step).toFixed(1)},${(h - ((v - min) / range) * (h - 3) - 1.5).toFixed(1)}`).join(' ');
  const last = data[data.length - 1];
  const lx = (w).toFixed(1);
  const ly = (h - ((last - min) / range) * (h - 3) - 1.5).toFixed(1);
  return `<svg class="dd2-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="2" fill="${stroke}"/>
  </svg>`;
}

function audiencePill(audience) {
  return `<span class="dd2-aud-pill dd2-aud-${audience.toLowerCase()}">${audience}</span>`;
}

/* ── Step 2: Quadrant chart ── */

function buildQuadrantChart() {
  const W = 1280;
  const H = 480;
  const PAD_L = 92;
  const PAD_R = 40;
  const PAD_T = 32;
  const PAD_B = 64;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;
  const MAX_D = 360;
  const MAX_S = 100;

  const toX = (d) => PAD_L + (d / MAX_D) * plotW;
  const toY = (s) => PAD_T + (1 - s / MAX_S) * plotH;

  // Gap quadrant = demand >= 60, satisfaction <= 55
  const gapX1 = toX(60);
  const gapX2 = toX(MAX_D);
  const gapY1 = toY(55);
  const gapY2 = toY(0);

  const gridXs = [60, 120, 180, 240, 300];
  const gridYs = [25, 50, 75, 100];

  const tierColor = {
    good: { fill: 'rgba(7,147,85,0.16)', stroke: '#079355', ink: '#0a5a38' },
    mid: { fill: 'rgba(230,134,25,0.16)', stroke: '#e68619', ink: '#8a4a00' },
    gap: { fill: 'rgba(215,50,32,0.18)', stroke: '#d73220', ink: '#5a1008' },
  };

  const bubbles = TOPICS.map((t) => {
    const cx = toX(t.demand);
    const cy = toY(t.sat);
    const r = 14 + Math.min(26, t.demand / 14);
    const c = tierColor[t.tier];
    return { ...t, cx, cy, r, c };
  });

  // Labels positioned to avoid overlap
  const labels = bubbles.map((b) => {
    // simple heuristic: put labels to the right if there's room, else left
    const side = b.cx > toX(220) ? 'left' : 'right';
    const lx = side === 'right' ? b.cx + b.r + 8 : b.cx - b.r - 8;
    const anchor = side === 'right' ? 'start' : 'end';
    return { ...b, lx, ly: b.cy + 4, anchor };
  });

  return `
    <svg class="dd2-quadrant" viewBox="0 0 ${W} ${H}" role="img" aria-label="Demand vs. satisfaction quadrant">
      <!-- Gap quadrant background -->
      <rect x="${gapX1}" y="${gapY1}" width="${gapX2 - gapX1}" height="${gapY2 - gapY1}" fill="rgba(215,50,32,0.07)"/>
      <text x="${gapX2 - 14}" y="${gapY1 + 22}" text-anchor="end" font-size="12" font-weight="700" fill="#d73220" letter-spacing="0.14em">OPPORTUNITY QUADRANT</text>

      <!-- Gridlines -->
      ${gridXs.map((d) => `<line x1="${toX(d)}" y1="${PAD_T}" x2="${toX(d)}" y2="${H - PAD_B}" stroke="#ededed" stroke-width="1"/>`).join('')}
      ${gridYs.map((s) => `<line x1="${PAD_L}" y1="${toY(s)}" x2="${W - PAD_R}" y2="${toY(s)}" stroke="#ededed" stroke-width="1"/>`).join('')}

      <!-- Axes -->
      <line x1="${PAD_L}" y1="${H - PAD_B}" x2="${W - PAD_R}" y2="${H - PAD_B}" stroke="#b3b3b3" stroke-width="1.25"/>
      <line x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${H - PAD_B}" stroke="#b3b3b3" stroke-width="1.25"/>

      <!-- X labels -->
      ${gridXs.map((d) => `<text x="${toX(d)}" y="${H - PAD_B + 20}" text-anchor="middle" font-size="12" fill="#8a8a8a">${d}</text>`).join('')}
      <text x="${(PAD_L + W - PAD_R) / 2}" y="${H - 14}" text-anchor="middle" font-size="13" font-weight="600" fill="#4a4a4a">Demand (queries per week) \u2192</text>

      <!-- Y labels -->
      ${gridYs.map((s) => `<text x="${PAD_L - 12}" y="${toY(s) + 4}" text-anchor="end" font-size="12" fill="#8a8a8a">${s}%</text>`).join('')}
      <text transform="translate(22 ${(PAD_T + H - PAD_B) / 2}) rotate(-90)" text-anchor="middle" font-size="13" font-weight="600" fill="#4a4a4a">Content satisfaction \u2191</text>

      <!-- Bubbles -->
      ${bubbles.map((b) => `
        <g class="dd2-bubble-g ${b.tier === 'gap' ? 'dd2-bubble-gap' : ''}" data-topic="${b.id}">
          <circle cx="${b.cx}" cy="${b.cy}" r="${b.r}" fill="${b.c.fill}" stroke="${b.c.stroke}" stroke-width="1.75"/>
          ${b.cited ? `<circle cx="${b.cx}" cy="${b.cy}" r="${b.r + 7}" fill="none" stroke="${b.c.stroke}" stroke-width="1.25" stroke-dasharray="3 3" opacity="0.65"/>` : ''}
        </g>
      `).join('')}

      <!-- Labels -->
      ${labels.map((b) => `
        <text x="${b.lx}" y="${b.ly}" text-anchor="${b.anchor}" font-size="13" font-weight="${b.tier === 'gap' ? 700 : 500}" fill="${b.c.ink}">${b.label}</text>
      `).join('')}
    </svg>
  `;
}

                  <span class="dd2-gap-stat"><strong>${g.sat}%</strong><em>satisfaction</em></span>

}

/* ── Live behaviors ── */

function startTicker() {
  const ticker = document.getElementById('dd2-ticker');
  if (!ticker) return;
  let idx = 0;
  let elapsed = 0;

  function addRow() {
    const q = EXTRA_QUERIES[idx % EXTRA_QUERIES.length];
    const row = document.createElement('div');
    row.className = 'dd2-ticker-row dd2-ticker-new';
    row.innerHTML = `
      <span class="dd2-ticker-time">just now</span>
      <span class="dd2-ticker-query">\u201c${q.query}\u201d</span>
      <span class="dd2-ticker-arrow">${ICONS.arrowRight}</span>
      <span class="dd2-aud-pill dd2-aud-${q.audience.toLowerCase()}">${q.audience}</span>
      <span class="dd2-ticker-blocks">${q.blocks} blocks</span>
      <span class="dd2-ticker-status">Generated</span>`;
    ticker.prepend(row);

    elapsed += 1;
    const rows = ticker.querySelectorAll('.dd2-ticker-row');
    rows.forEach((r, i) => {
      if (i === 0) return;
      const t = r.querySelector('.dd2-ticker-time');
      if (!t) return;
      const secs = i * 4 + elapsed;
      t.textContent = secs < 60 ? `${secs}s ago` : `${Math.floor(secs / 60)}m ago`;
    });

    while (ticker.children.length > 10) {
      ticker.removeChild(ticker.lastChild);
    }

    idx += 1;
    const delay = 1200 + Math.random() * 4000;
    setTimeout(addRow, delay);
  }

  setTimeout(addRow, 1500);
}

function startSessionCounter() {
  const countEl = document.getElementById('dd2-session-count');
  const updatedEl = document.getElementById('dd2-updated-secs');
  if (!countEl) return;
  let n = 2487;
  let updated = 3;

  setInterval(() => {
    const bump = 1 + Math.floor(Math.random() * 4);
    n += bump;
    countEl.textContent = n.toLocaleString();
    updated = 0;
    if (updatedEl) updatedEl.textContent = String(updated);
  }, 2600);

  setInterval(() => {
    updated += 1;
    if (updatedEl) updatedEl.textContent = String(updated);
  }, 1000);
}

function wireInsightJumps() {
  document.querySelectorAll('.dd2-insight .dd2-link-btn').forEach((btn, idx) => {
    btn.addEventListener('click', () => {
      const insight = INSIGHTS[idx];
      if (!insight) return;
      document.querySelectorAll('.dd2-mx-cell').forEach((c) => c.classList.remove('dd2-mx-cell-pulse'));
      insight.cells.forEach((id) => {
        const cell = document.querySelector(`.dd2-mx-cell[data-cell="${id}"]`);
        if (cell) {
          cell.classList.add('dd2-mx-cell-pulse');
          setTimeout(() => cell.classList.remove('dd2-mx-cell-pulse'), 1800);
        }
      });
    });
  });
}

/* ── Step navigation ── */

function showStep(n) {
  const step1 = document.getElementById('dd2-step1');
  const step2 = document.getElementById('dd2-step2');
  if (!step1 || !step2) return;
  if (n === 2) {
    step1.classList.add('dd2-hidden');
    step2.classList.remove('dd2-hidden');
    step2.classList.add('dd2-fade-in');
    setTimeout(() => step2.classList.remove('dd2-fade-in'), 400);
  } else {
    step2.classList.add('dd2-hidden');
    step1.classList.remove('dd2-hidden');
    step1.classList.add('dd2-fade-in');
    setTimeout(() => step1.classList.remove('dd2-fade-in'), 400);
  }
  document.querySelectorAll('.dd2-nav-step').forEach((btn) => {
    const step = parseInt(btn.getAttribute('data-step'), 10);
    const active = step === n;
    btn.classList.toggle('dd2-nav-active', active);
    if (active) btn.setAttribute('aria-current', 'page');
    else btn.removeAttribute('aria-current');
  });
  const main = document.querySelector('.dd2-main');
  if (main) main.scrollTo({ top: 0, behavior: 'instant' });
}

function wireStepper() {
  document.querySelectorAll('.dd2-nav-step').forEach((btn) => {
    btn.addEventListener('click', () => {
      const step = parseInt(btn.getAttribute('data-step'), 10);
      if (step) showStep(step);
    });
  });
}

function wireKeyboard() {
  let current = 1;
  window.addEventListener('keydown', (e) => {
    if (e.altKey && (e.key === '1' || e.code === 'Digit1')) {
      e.preventDefault();
      current = 1;
      showStep(1);
    } else if (e.altKey && (e.key === '2' || e.code === 'Digit2')) {
      e.preventDefault();
      current = 2;
      showStep(2);
    } else if (!e.altKey && (e.key === 'ArrowRight' || e.key === ' ')) {
      if (e.target && e.target.tagName === 'INPUT') return;
      e.preventDefault();
      current = Math.min(2, current + 1);
      showStep(current);
    } else if (!e.altKey && e.key === 'ArrowLeft') {
      e.preventDefault();
      current = Math.max(1, current - 1);
      showStep(current);
    }
  });
}

/* ── Main (runs on DOMContentLoaded) ── */

document.addEventListener('DOMContentLoaded', () => {
  const block = document.getElementById('dashboard-container');
  block.innerHTML = '';
  const shell = document.createElement('div');
  shell.className = 'dd2-shell';
  shell.innerHTML = buildShell();
  block.appendChild(shell);

  const content = shell.querySelector('#dd2-content');
  content.innerHTML = buildView();

  startTicker();
  startSessionCounter();
  wireInsightJumps();
  wireStepper();
  wireKeyboard();

  // URL param to deep-link to step
  const stepParam = new URLSearchParams(window.location.search).get('step');
  if (stepParam === '2') showStep(2);
});
  </script>
