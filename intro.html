<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Project Page Turner — A Page for Everyone. For Everyone.</title>
<style>
  @font-face {
    font-family: "Adobe Clean";
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    src: url("/fonts/AdobeClean-Regular.otf") format("opentype");
  }
  @font-face {
    font-family: "Adobe Clean";
    font-weight: 500;
    font-style: normal;
    font-display: swap;
    src: url("/fonts/AdobeClean-Medium.otf") format("opentype");
  }
  @font-face {
    font-family: "Adobe Clean";
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    src: url("/fonts/AdobeClean-Bold.otf") format("opentype");
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --font: "Adobe Clean", "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --serif: "Source Serif 4", "Source Serif Pro", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --ink: #f7f5f1;
    --ink-dim: rgb(247 245 241 / 0.65);
    --red: #ff3b1f;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: var(--font);
    background: #0a0a0c;
    color: var(--ink);
  }

  /* ── Stage ── */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Background image ── */
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* Soft top/bottom vignette for legibility of title + brand marks */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgb(0 0 0 / 0.55) 0%, rgb(0 0 0 / 0.15) 22%, transparent 42%, transparent 70%, rgb(0 0 0 / 0.55) 100%);
  }

  /* ── Vertical dividers between the three scenes (span the caption block) ── */
  .divider {
    position: absolute;
    top: 14%;
    height: 20%;
    width: 2px;
    background: linear-gradient(180deg, transparent 0%, rgb(255 255 255 / 0.55) 18%, rgb(255 255 255 / 0.55) 82%, transparent 100%);
    pointer-events: none;
    z-index: 2;
  }
  .divider.v1 { left: 33.3333%; }
  .divider.v2 { left: 66.6666%; }

  /* ── Brand marks ── */
  .mark-tl {
    position: absolute;
    top: 36px;
    left: 44px;
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 5;
    mix-blend-mode: screen;
  }

  .mark-tl-text {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--ink);
    text-shadow: 0 2px 10px rgb(0 0 0 / 0.6);
  }

  .project {
    position: absolute;
    top: 36px;
    right: 44px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 30px;
    color: var(--ink);
    text-shadow: 0 2px 10px rgb(0 0 0 / 0.6);
    z-index: 5;
  }

  .mark-br {
    position: absolute;
    bottom: 36px;
    right: 44px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink);
    text-shadow: 0 2px 10px rgb(0 0 0 / 0.6);
    z-index: 5;
  }

  /* ── Scene captions (one per third) — always visible ── */
  .caption {
    position: absolute;
    top: 14%;
    width: 30%;
    padding: 0 24px;
    text-align: center;
    z-index: 3;
    pointer-events: none;
  }

  .caption-kicker {
    display: inline-block;
    margin-bottom: 28px;
    padding: 8px 24px;
    border: 1px solid rgb(255 255 255 / 0.55);
    border-radius: 999px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    background: rgb(0 0 0 / 0.2);
  }

  .caption-text {
    font-family: var(--serif);
    font-size: 56px;
    font-weight: 400;
    line-height: 1.25;
    color: var(--ink);
    text-shadow: 0 2px 24px rgb(0 0 0 / 0.85), 0 1px 3px rgb(0 0 0 / 0.9);
  }

  .caption-text em {
    font-style: italic;
    font-size: 2em;
    font-weight: 700;
    line-height: 0.9;
    display: inline-block;
    vertical-align: -0.12em;
    letter-spacing: -0.02em;
  }

  .caption-text em {
    font-style: italic;
  }

  .c1 { left: 1.6%; }
  .c2 { left: 35%; }
  .c3 { left: 68.4%; }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- Background -->
  <img class="bg" src="/intro-bg.png" alt="">

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- Vertical dividers between the three scenes -->
  <div class="divider v1"></div>
  <div class="divider v2"></div>

  <!-- Brand marks -->
  <div class="mark-tl">
    <svg width="39" height="34" viewBox="0 0 24 20" fill="none">
      <path d="M9.2 0H0v20l9.2-20zM14.8 0H24v20l-9.2-20zM12 7.4L16.6 20h-3.4l-1.4-3.8H8.2L12 7.4z" fill="#eb1000"/>
    </svg>
    <span class="mark-tl-text">Adobe Experience Manager</span>
  </div>
  <div class="project">Project Page Turner</div>

  <!-- Captions over each scene (always visible) -->
  <div class="caption c1">
    <span class="caption-kicker">Today</span>
    <div class="caption-text">Everyone gets the same page</div>
  </div>
  <div class="caption c2">
    <span class="caption-kicker">The workaround</span>
    <div class="caption-text">Audience based personalization</div>
  </div>
  <div class="caption c3">
    <span class="caption-kicker">What if</span>
    <div class="caption-text">Audiences of <em>ONE</em></div>
  </div>

</div>

</body>
</html>
